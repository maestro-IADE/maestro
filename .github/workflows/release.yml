# Pushing a tag vX.Y.Z builds the installers on Windows, macOS (Apple silicon, Intel) and Linux, attaches them to a
# draft release under fixed names (Maestro-windows-x64-setup.exe, ...), and publishes the release as "latest" only
# once every build has uploaded. The website and the README link to releases/latest/download/<fixed name>, so they
# never point at a half-built release. Notes come from the Conventional Commits since the previous tag (cliff.toml).
# The version in package.json, Cargo.toml and tauri.conf.json must match the tag: run `node scripts/version.mjs X.Y.Z`
# first. Every installer is also signed with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]), and the
# publish job writes latest.json from those signatures, so installed apps find the new version
# (docs/features/ui/auto-update.md). See docs/reference/release.md.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # vite runs out of the default ~2 GB heap bundling Monaco on the macOS runners
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Version matches the tag
        run: node scripts/version.mjs --check "$TAG"

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: notes.md

      - name: Draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; builds will replace its files"
          else
            gh release create "$TAG" --draft --verify-tag --title "Maestro $TAG" --notes-file notes.md
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # createUpdaterArtifacts only here: it needs the private key, which local builds don't have
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          UPDATER='{"bundle":{"createUpdaterArtifacts":true}}'
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri build -- --target "${{ matrix.target }}" --config "$UPDATER"
          else
            npm run tauri build -- --config "$UPDATER"
          fi

      - name: Upload under fixed names
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -n "${{ matrix.target }}" ]; then B="src-tauri/target/${{ matrix.target }}/release/bundle"; else B="src-tauri/target/release/bundle"; fi
          mkdir -p out
          pick() { local f=("$@"); [ ${#f[@]} -eq 1 ] || { echo "expected one file, got: ${f[*]:-none}"; exit 1; }; echo "${f[0]}"; }
          # the file and its updater signature (<file>.sig) under the fixed name; sig optional for deb/rpm
          put() { cp "$1" "out/$2"; if [ -f "$1.sig" ]; then cp "$1.sig" "out/$2.sig"; elif [ -z "${3:-}" ]; then echo "no signature for $1"; exit 1; fi; }
          case "${{ runner.os }}-${{ matrix.target }}" in
            Windows-*)
              put "$(pick "$B"/nsis/*-setup.exe)" Maestro-windows-x64-setup.exe
              put "$(pick "$B"/msi/*.msi)" Maestro-windows-x64.msi ;;
            macOS-aarch64-apple-darwin)
              cp "$(pick "$B"/dmg/*.dmg)" out/Maestro-macos-arm64.dmg
              put "$(pick "$B"/macos/*.app.tar.gz)" Maestro-macos-arm64.app.tar.gz ;;
            macOS-x86_64-apple-darwin)
              cp "$(pick "$B"/dmg/*.dmg)" out/Maestro-macos-x64.dmg
              put "$(pick "$B"/macos/*.app.tar.gz)" Maestro-macos-x64.app.tar.gz ;;
            Linux-*)
              put "$(pick "$B"/appimage/*.AppImage)" Maestro-linux-x86_64.AppImage
              put "$(pick "$B"/deb/*.deb)" Maestro-linux-amd64.deb optional
              put "$(pick "$B"/rpm/*.rpm)" Maestro-linux-x86_64.rpm optional ;;
          esac
          ls -l out
          gh release upload "$TAG" out/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # the manifest installed apps poll (releases/latest/download/latest.json), from the signatures the builds uploaded
      - name: Updater manifest
        run: |
          mkdir sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          node scripts/updater-manifest.mjs "$TAG" sigs "$GITHUB_REPOSITORY" > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish as latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
