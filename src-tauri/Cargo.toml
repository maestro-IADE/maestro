[package]
name = "maestro"
version = "0.3.2"
edition = "2021"
# src/bin/maestro-cli.rs is the agents' `maestro` command; `cargo run` / tauri dev start the app
default-run = "maestro"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
base64 = "0.22"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
# registered first in main(): a second launch focuses the running window and exits
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
